name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    outputs:
      validation_artifact_id: ${{ steps.upload_validation_reports.outputs.artifact-id }}
    name: Validate release commit and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove checkout matches the event commit
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          expected_commit="${{ github.sha }}"
          test -n "$expected_commit"
          if [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "::error::Checkout $checked_out_commit does not match event commit $expected_commit"
            exit 1
          fi
          echo "Validated release commit: $checked_out_commit"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Node QA dependencies
        run: npm ci

      - name: Install Node Playwright engines
        run: npx playwright install chromium firefox webkit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check GitHub Actions versions
        run: python3 scripts/check-workflow-actions.py

      - name: Install validator dependency
        run: python3 -m pip install -r requirements-qa.txt

      - name: Install browsers for browser release gate
        run: playwright install --with-deps chromium firefox webkit

      - name: Generate current search and universe maps
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py

      - name: Check universe integration and freshness
        run: |
          python3 scripts/tests/test-universe-integration.py
          python3 .agents/skills/okhp3-universe-map/tests/test-universe-map.py
          python3 scripts/sync-universe-map.py --check

      - name: Check generated search index
        run: python3 scripts/build-search-index.py --check

      - name: Check generated portfolio statistics
        run: python3 scripts/sync-portfolio-stats.py --check

      - name: Check generated sitemap and feed
        run: |
          python3 scripts/generate-sitemap.py --check
          python3 scripts/generate-feed.py --check

      - name: Check CSS cache tokens
        run: python3 scripts/sync-css-version.py --check

      - name: Check landscape social-card metadata
        run: python3 scripts/sync-social-card.py --check

      - name: Check search coverage scope
        run: python3 scripts/check-search-coverage.py

      - name: Run static release gates
        run: |
          python3 scripts/check-csp.py
          python3 scripts/tests/test_pages_search_coverage_gate.py
          python3 scripts/tests/test-visitor-truth.py
          python3 scripts/tests/test_content_claims.py
          python3 scripts/tests/test-search-index.py
          python3 scripts/tests/test_public_artifact.py
          python3 scripts/tests/test_svg_assets.py
          python3 scripts/tests/test_offline_validation.py
          python3 scripts/tests/test_validation_report.py
          python3 scripts/tests/test-pages-validation-evidence.py
          node --test scripts/tests/test-sw-resilience.cjs
          node scripts/tests/test-sw-bootstrap.cjs
          python3 scripts/validate-site.py --commit "${{ github.sha }}"
          python3 scripts/check-links.py
          python3 scripts/check-accent-contrast.py --strict
          python3 scripts/check-glee-dark-coverage.py --section all --require-both

      - name: Run FoundRy accessibility evidence in Chromium, Firefox, and WebKit
        id: foundry_accessibility
        run: |
          set -uo pipefail
          failed=0
          for engine in chromium firefox webkit; do
            if npm run qa:foundry-accessibility -- \
              --engine "$engine" \
              --output "$RUNNER_TEMP/foundry-accessibility-${engine}.json"; then
              :
            else
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify FoundRy accessibility report contracts
        if: ${{ always() && (steps.foundry_accessibility.outcome == 'success' || steps.foundry_accessibility.outcome == 'failure') }}
        run: |
          set -uo pipefail
          failed=0
          if ! python3 scripts/tests/test-foundry-accessibility-report.py; then
            failed=1
          fi
          for engine in chromium firefox webkit; do
            if ! python3 scripts/check-foundry-accessibility-report.py \
              --engine "$engine" \
              "$RUNNER_TEMP/foundry-accessibility-${engine}.json"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload FoundRy accessibility evidence
        if: ${{ always() && (steps.foundry_accessibility.outcome == 'success' || steps.foundry_accessibility.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: foundry-accessibility-${{ github.sha }}
          path: ${{ runner.temp }}/foundry-accessibility-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run advisory site audit
        continue-on-error: true
        run: python3 scripts/audit-site.py --quiet

      - name: Verify validation report provenance
        id: validation_provenance
        if: always()
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_COMMIT"].lower()
          matches = []
          for path in Path("assets/audit").glob("validation-report-*.json"):
              report = json.loads(path.read_text(encoding="utf-8"))
              if report.get("provenance", {}).get("validated_commit") == expected:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"Expected one validation report for {expected}, got {len(matches)}")
          report_path = matches[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"report_name={report_path.name}\n")
          print(f"Verified {report_path} was produced from {expected}")
          PY

      - name: Start local server for browser release gate
        run: |
          python3 scripts/serve-site.py >/tmp/glee-pages-server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/glee-pages-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              echo "Server ready."
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null \
            || { cat /tmp/glee-pages-server.log; exit 1; }

      - name: Verify generated map browser journeys
        run: python3 scripts/tests/test-universe-browser.py

      - name: Run browser responsive and asset QA
        run: python3 scripts/run-viewport-qa.py

      - name: Run visitor, privacy, and rendered contrast acceptance
        run: python3 scripts/tests/test_browser_acceptance.py --base-url http://127.0.0.1:5000 --output assets/audit/browser-acceptance.json

      - name: Run resilient web behavior QA
        run: python3 scripts/resilience-qa.py --base-url http://localhost:5000

      - name: Run color-scheme bootstrap regression in all installed engines
        run: |
          failed=0
          for browser in chromium firefox webkit; do
            python3 scripts/tests/test-color-scheme-init.py \
              --base-url http://localhost:5000 \
              --browser "$browser" \
              --output "assets/audit/color-scheme-init-$browser.json" \
              || failed=1
          done
          exit "$failed"

      - name: Verify browser-specific theme evidence
        id: theme_evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit_dir = Path("assets/audit")
          expected = ("chromium", "firefox", "webkit")
          missing = []
          invalid = []
          versions = {}
          for browser in expected:
              path = audit_dir / f"color-scheme-init-{browser}.json"
              if not path.is_file():
                  missing.append(path.name)
                  continue
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  invalid.append(f"{path.name}: cannot parse JSON ({error})")
                  continue
              if report.get("browser") != browser:
                  invalid.append(
                      f"{path.name}: browser={report.get('browser')!r}, expected {browser!r}"
                  )
              version = report.get("browser_version")
              if not isinstance(version, str) or not version.strip():
                  invalid.append(
                      f"{path.name}: browser_version must be a non-empty string"
                  )
              else:
                  versions[browser] = version.strip()
              if report.get("status") != "PASS":
                  invalid.append(f"{path.name}: status={report.get('status')!r}, expected 'PASS'")
              cases = report.get("cases")
              if not isinstance(cases, dict) or not {"light", "dark", "disabled_storage"} <= cases.keys():
                  invalid.append(
                      f"{path.name}: expected light, dark, and disabled_storage cases"
                  )

          if missing or invalid:
              details = []
              if missing:
                  details.append("missing: " + ", ".join(missing))
              if invalid:
                  details.append("invalid: " + "; ".join(invalid))
              raise SystemExit(
                  "Browser-specific color-scheme evidence is incomplete; "
                  + " | ".join(details)
              )
          rows = [
              "| Browser engine | Browser version | Covered cases | Report |",
              "| --- | --- | --- | --- |",
          ]
          labels = {
              "chromium": "Chromium",
              "firefox": "Firefox",
              "webkit": "WebKit",
          }
          covered_cases = (
              "`light` (saved light preference); "
              "`dark` (saved dark preference); "
              "`disabled_storage` (local storage blocked)"
          )
          for browser in expected:
              report_name = f"color-scheme-init-{browser}.json"
              rows.append(
                  f"| {labels[browser]} | {versions[browser]} | {covered_cases} | "
                  f"[`{report_name}`]({report_name}) |"
              )
          index = [
              "# Browser color-scheme evidence",
              "",
              "Generated from the successful browser theme checks for this "
              "Pages validation run.",
              "",
              *rows,
              "",
          ]
          (audit_dir / "color-scheme-evidence-index.md").write_text(
              "\n".join(index), encoding="utf-8"
          )
          print("Verified browser-specific color-scheme evidence for chromium, firefox, and webkit.")
          PY

      - name: Verify custom domain and required public files
        run: |
          test -s CNAME
          test "$(cat CNAME)" = "glee-fully.tools"
          test -s index.html
          test -s 404.html
          test -s offline.html
          test -s sw.js
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest

      - name: Stage and verify the reviewed public inventory
        run: |
          python3 scripts/public-artifact.py stage --output "$RUNNER_TEMP/glee-public-site"
          python3 scripts/public-artifact.py verify --output "$RUNNER_TEMP/glee-public-site"
          python3 scripts/check-pages-artifact.py "$RUNNER_TEMP/glee-public-site"

      - name: Upload artifact from validated commit
        uses: actions/upload-artifact@v7
        with:
          name: pages-site-${{ github.sha }}
          path: ${{ runner.temp }}/glee-public-site
          # Only the allowlisted, verified staging tree can include hidden files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Stage complete validation evidence
        id: validation_staging
        if: ${{ success() && steps.validation_provenance.outcome == 'success' && steps.theme_evidence.outcome == 'success' }}
        env:
          VALIDATION_ARTIFACT_DIR: ${{ runner.temp }}/pages-validation
          VALIDATION_REPORT_NAME: ${{ steps.validation_provenance.outputs.report_name }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          artifact_dir = Path(os.environ["VALIDATION_ARTIFACT_DIR"])
          audit_dir = artifact_dir / "assets" / "audit"
          shutil.copytree("assets/audit", audit_dir)

          current_report = os.environ["VALIDATION_REPORT_NAME"]
          for report in audit_dir.glob("validation-report-*.json"):
              if report.name != current_report:
                  report.unlink()

          audit_summary = Path("assets/docs/audit-report.md")
          if audit_summary.is_file():
              destination = artifact_dir / audit_summary
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(audit_summary, destination)
              with destination.open("a", encoding="utf-8") as report:
                  report.write(
                      "\n\n## Browser theme release evidence\n\n"
                      "See the [browser color-scheme evidence index]"
                      "(../audit/color-scheme-evidence-index.md) for the "
                      "Chromium, Firefox, and WebKit reports from this "
                      "validation run.\n"
                  )
          PY

      - name: Upload validation reports
        id: upload_validation_reports
        if: ${{ always() && steps.validation_provenance.outcome == 'success' && steps.validation_staging.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-validation-${{ github.sha }}
          path: ${{ runner.temp }}/pages-validation
          if-no-files-found: warn
          retention-days: 90

  verify-validation-evidence:
    name: Verify uploaded Pages validation evidence
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify validation artifact retention
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_ARTIFACT_ID: ${{ needs.validate.outputs.validation_artifact_id }}
          EXPECTED_ARTIFACT_NAME: pages-validation-${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VALIDATION_ARTIFACT_ID"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID" \
            | python3 scripts/check-pages-validation-retention.py \
                --artifact-id "$VALIDATION_ARTIFACT_ID" \
                --artifact-name "$EXPECTED_ARTIFACT_NAME"

      - name: Download validation reports for this commit
        uses: actions/download-artifact@v8
        with:
          name: pages-validation-${{ github.sha }}
          path: ${{ runner.temp }}/pages-validation

      - name: Verify downloaded browser theme reports
        id: downloaded_theme_evidence
        env:
          VALIDATION_ARTIFACT_DIR: ${{ runner.temp }}/pages-validation
        run: |
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          validation_dir = Path(os.environ["VALIDATION_ARTIFACT_DIR"])
          audit_dir = validation_dir / "assets" / "audit"
          expected = (
              "color-scheme-init-chromium.json",
              "color-scheme-init-firefox.json",
              "color-scheme-init-webkit.json",
          )
          missing = [name for name in expected if not (audit_dir / name).is_file()]
          index_path = audit_dir / "color-scheme-evidence-index.md"
          if not index_path.is_file():
              missing.append(index_path.name)
          if missing:
              raise SystemExit(
                  "Downloaded Pages validation artifact is missing browser theme reports: "
                  + ", ".join(missing)
              )
          index = index_path.read_text(encoding="utf-8")
          labels = {
              "chromium": "Chromium",
              "firefox": "Firefox",
              "webkit": "WebKit",
          }
          covered_cases = (
              "`light` (saved light preference); "
              "`dark` (saved dark preference); "
              "`disabled_storage` (local storage blocked)"
          )
          required_rows = set()
          for browser, label in labels.items():
              report_path = audit_dir / f"color-scheme-init-{browser}.json"
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise SystemExit(
                      f"{report_path.name}: cannot parse downloaded JSON ({error})"
                  )
              if report.get("browser") != browser:
                  raise SystemExit(
                      f"{report_path.name}: browser={report.get('browser')!r}, "
                      f"expected {browser!r}"
                  )
              version = report.get("browser_version")
              if not isinstance(version, str) or not version.strip():
                  raise SystemExit(
                      f"{report_path.name}: browser_version must be a non-empty string"
                  )
              report_name = report_path.name
              required_rows.add(
                  f"| {label} | {version.strip()} | {covered_cases} | "
                  f"[`{report_name}`]({report_name}) |"
              )
          missing_rows = sorted(row for row in required_rows if row not in index)
          if missing_rows:
              raise SystemExit(
                  "Downloaded Pages validation artifact has an incomplete browser "
                  "theme index: " + "; ".join(missing_rows)
              )
          audit_summary = validation_dir / "assets" / "docs" / "audit-report.md"
          if not audit_summary.is_file():
              raise SystemExit(
                  "Downloaded Pages validation artifact is missing assets/docs/audit-report.md"
              )
          summary_text = audit_summary.read_text(encoding="utf-8")
          if (
              "[browser color-scheme evidence index]"
              "(../audit/color-scheme-evidence-index.md)"
          ) not in summary_text:
              raise SystemExit(
                  "Downloaded audit report does not link to the browser theme index"
              )
          print(
              "Verified all three browser theme reports and their indexed cases "
              "in the downloaded Pages validation artifact."
          )
          PY

      - name: Add verified browser theme results to run summary
        if: ${{ success() && steps.downloaded_theme_evidence.outcome == 'success' }}
        env:
          VALIDATION_ARTIFACT_DIR: ${{ runner.temp }}/pages-validation
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          validation_dir = Path(os.environ["VALIDATION_ARTIFACT_DIR"])
          audit_dir = validation_dir / "assets" / "audit"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit("GITHUB_STEP_SUMMARY is not available")

          browsers = (
              ("chromium", "Chromium"),
              ("firefox", "Firefox"),
              ("webkit", "WebKit"),
          )
          required_cases = {"light", "dark", "disabled_storage"}
          rows = [
              "| Browser engine | Browser version | Light preference | "
              "Dark preference | Disabled storage | Evidence |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          for browser, label in browsers:
              report_path = audit_dir / f"color-scheme-init-{browser}.json"
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise SystemExit(
                      f"{report_path.name}: cannot read verified browser report ({error})"
                  )
              if report.get("browser") != browser or report.get("status") != "PASS":
                  raise SystemExit(
                      f"{report_path.name}: expected {browser} report with PASS status"
                  )
              version = report.get("browser_version")
              if not isinstance(version, str) or not version.strip():
                  raise SystemExit(
                      f"{report_path.name}: browser_version must be a non-empty string"
                  )
              cases = report.get("cases")
              if not isinstance(cases, dict) or not required_cases <= cases.keys():
                  raise SystemExit(
                      f"{report_path.name}: expected light, dark, and disabled_storage cases"
                  )
              rows.append(
                  f"| {label} | {version.strip()} | Pass | Pass | Pass | "
                  f"`{report_path.name}` |"
              )

          summary = [
              "## Browser theme results",
              "",
              "The downloaded, verified Pages validation artifact passed these cases:",
              "",
              *rows,
              "",
              "Light and dark use saved preferences; disabled storage blocks local storage.",
              "",
          ]
          with Path(summary_path).open("a", encoding="utf-8") as output:
              output.write("\n".join(summary))
          PY

  deploy:
    name: Deploy validated Pages artifact
    needs: [validate, verify-validation-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact release commit for artifact verification
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download artifact for this commit
        uses: actions/download-artifact@v8
        with:
          name: pages-site-${{ github.sha }}
          path: ${{ runner.temp }}/glee-public-site

      - name: Set up the matching generation runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Reproduce generated release files from the exact commit
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py
          python3 scripts/sync-universe-map.py --check

      - name: Verify transferred inventory, hidden public files, and release bytes
        run: python3 scripts/public-artifact.py verify --output "$RUNNER_TEMP/glee-public-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/glee-public-site
          # v5 also filters dot paths by default; preserve the verified files.
          include-hidden-files: true

      - name: Verify the final Pages archive before deployment
        run: |
          python3 scripts/public-artifact.py verify-tar \
            --output "$RUNNER_TEMP/glee-public-site" --archive "$RUNNER_TEMP/artifact.tar"

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test live security headers
        continue-on-error: true
        run: python3 scripts/check-public-headers.py --url https://glee-fully.tools/
