name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release commit and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prove checkout matches the event commit
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          expected_commit="${{ github.sha }}"
          test -n "$expected_commit"
          if [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "::error::Checkout $checked_out_commit does not match event commit $expected_commit"
            exit 1
          fi
          echo "Validated release commit: $checked_out_commit"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check GitHub Actions versions
        run: python3 scripts/check-workflow-actions.py

      - name: Install validator dependency
        run: python3 -m pip install beautifulsoup4 playwright

      - name: Install browsers for browser release gate
        run: playwright install --with-deps chromium firefox webkit

      - name: Check generated search index
        run: python3 scripts/build-search-index.py --check

      - name: Check generated portfolio statistics
        run: python3 scripts/sync-portfolio-stats.py --check

      - name: Check CSS cache tokens
        run: python3 scripts/sync-css-version.py --check

      - name: Check landscape social-card metadata
        run: python3 scripts/sync-social-card.py --check

      - name: Run static release gates
        run: |
          python3 scripts/validate-site.py
          python3 scripts/check-links.py
          python3 scripts/check-accent-contrast.py --strict
          python3 scripts/check-glee-dark-coverage.py --section all --require-both

      - name: Run advisory site audit
        continue-on-error: true
        run: python3 scripts/audit-site.py --quiet

      - name: Start local server for browser release gate
        run: |
          python3 scripts/serve-site.py >/tmp/glee-pages-server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/glee-pages-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              echo "Server ready."
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null \
            || { cat /tmp/glee-pages-server.log; exit 1; }

      - name: Run browser responsive and asset QA
        run: python3 scripts/run-viewport-qa.py

      - name: Run resilient web behavior QA
        run: python3 scripts/resilience-qa.py --base-url http://localhost:5000

      - name: Verify custom domain and required public files
        run: |
          test -s CNAME
          test "$(cat CNAME)" = "glee-fully.tools"
          test -s index.html
          test -s 404.html
          test -s offline.html
          test -s sw.js
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest

      - name: Build artifact from the validated checkout
        run: |
          rm -rf dist-pages
          mkdir -p dist-pages
          python3 - <<'PY'
          from pathlib import Path
          from shutil import copytree, ignore_patterns

          source = Path(".")
          destination = Path("dist-pages")
          ignored = ignore_patterns(
              ".git", ".github", ".agents", ".local", ".cache", ".pythonlibs",
              "attached_assets", "node_modules", "scripts", "dist-pages",
              "AGENTS.md", "replit.md", ".replit", "package.json",
              "package-lock.json", "docs", "audit",
          )
          copytree(
              source,
              destination,
              ignore=ignored,
              dirs_exist_ok=True,
              ignore_dangling_symlinks=True,
          )
          PY
          test -s dist-pages/CNAME
          test -s dist-pages/index.html
          test -s dist-pages/offline.html
          test -s dist-pages/sw.js
          test "$(cat dist-pages/CNAME)" = "glee-fully.tools"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          provenance = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit": os.environ["GITHUB_SHA"],
              "ref": os.environ["GITHUB_REF"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "workflow_run": os.environ["GITHUB_RUN_ID"],
          }
          Path("dist-pages/release-provenance.json").write_text(
              json.dumps(provenance, indent=2) + "\n", encoding="utf-8"
          )
          PY
          test -s dist-pages/release-provenance.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          import os

          provenance = json.loads(Path("dist-pages/release-provenance.json").read_text())
          assert provenance["commit"] == os.environ["GITHUB_SHA"]
          PY

      - name: Upload artifact from validated commit
        uses: actions/upload-artifact@v7
        with:
          name: pages-site-${{ github.sha }}
          path: dist-pages
          if-no-files-found: error
          retention-days: 1

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-validation-${{ github.sha }}
          path: |
            assets/audit/
            assets/docs/audit-report.md
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy validated Pages artifact
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download artifact for this commit
        uses: actions/download-artifact@v8
        with:
          name: pages-site-${{ github.sha }}
          path: dist-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Checkout validated commit for live smoke test
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Smoke-test live security headers
        continue-on-error: true
        run: python3 scripts/check-public-headers.py --url https://glee-fully.tools/