name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    outputs:
      validation_artifact_id: ${{ steps.upload_validation_reports.outputs.artifact-id }}
    name: Validate release commit and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prove checkout matches the event commit
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          expected_commit="${{ github.sha }}"
          test -n "$expected_commit"
          if [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "::error::Checkout $checked_out_commit does not match event commit $expected_commit"
            exit 1
          fi
          echo "Validated release commit: $checked_out_commit"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Node QA dependencies
        run: npm ci

      - name: Install Node Playwright engines
        run: npx playwright install chromium firefox webkit

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check GitHub Actions versions
        run: python3 scripts/check-workflow-actions.py

      - name: Install validator dependency
        run: python3 -m pip install -r requirements-qa.txt

      - name: Install browsers for browser release gate
        run: playwright install --with-deps chromium firefox webkit

      - name: Generate current search and universe maps
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py

      - name: Check universe integration and freshness
        run: |
          python3 scripts/tests/test-universe-integration.py
          python3 .agents/skills/okhp3-universe-map/tests/test-universe-map.py
          python3 scripts/sync-universe-map.py --check

      - name: Check generated search index
        run: python3 scripts/build-search-index.py --check

      - name: Check generated portfolio statistics
        run: python3 scripts/sync-portfolio-stats.py --check

      - name: Check generated sitemap and feed
        run: |
          python3 scripts/generate-sitemap.py --check
          python3 scripts/generate-feed.py --check

      - name: Check CSS cache tokens
        run: python3 scripts/sync-css-version.py --check

      - name: Check landscape social-card metadata
        run: python3 scripts/sync-social-card.py --check

      - name: Check search coverage scope
        run: python3 scripts/check-search-coverage.py

      - name: Run static release gates
        run: |
          python3 scripts/check-csp.py
          python3 scripts/tests/test_pages_search_coverage_gate.py
          python3 scripts/tests/test-visitor-truth.py
          python3 scripts/tests/test_content_claims.py
          python3 scripts/tests/test-search-index.py
          python3 scripts/tests/test_public_artifact.py
          python3 scripts/tests/test_svg_assets.py
          python3 scripts/tests/test_offline_validation.py
          python3 scripts/tests/test_validation_report.py
          python3 scripts/tests/test-pages-validation-evidence.py
          node --test scripts/tests/test-sw-resilience.cjs
          node scripts/tests/test-sw-bootstrap.cjs
          python3 scripts/validate-site.py --commit "${{ github.sha }}"
          python3 scripts/check-links.py
          python3 scripts/check-accent-contrast.py --strict
          python3 scripts/check-glee-dark-coverage.py --section all --require-both

      - name: Run FoundRy accessibility evidence in Chromium, Firefox, and WebKit
        id: foundry_accessibility
        run: |
          set -uo pipefail
          failed=0
          for engine in chromium firefox webkit; do
            if npm run qa:foundry-accessibility -- \
              --engine "$engine" \
              --output "$RUNNER_TEMP/foundry-accessibility-${engine}.json"; then
              :
            else
              failed=1
            fi
          done
          exit "$failed"

      - name: Verify FoundRy accessibility report contracts
        if: ${{ always() && (steps.foundry_accessibility.outcome == 'success' || steps.foundry_accessibility.outcome == 'failure') }}
        run: |
          set -uo pipefail
          failed=0
          if ! python3 scripts/tests/test-foundry-accessibility-report.py; then
            failed=1
          fi
          for engine in chromium firefox webkit; do
            if ! python3 scripts/check-foundry-accessibility-report.py \
              --engine "$engine" \
              "$RUNNER_TEMP/foundry-accessibility-${engine}.json"; then
              failed=1
            fi
          done
          exit "$failed"

      - name: Upload FoundRy accessibility evidence
        if: ${{ always() && (steps.foundry_accessibility.outcome == 'success' || steps.foundry_accessibility.outcome == 'failure') }}
        uses: actions/upload-artifact@v7
        with:
          name: foundry-accessibility-${{ github.sha }}
          path: ${{ runner.temp }}/foundry-accessibility-*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run advisory site audit
        continue-on-error: true
        run: python3 scripts/audit-site.py --quiet

      - name: Verify validation report provenance
        id: validation_provenance
        if: always()
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = os.environ["EXPECTED_COMMIT"].lower()
          matches = []
          for path in Path("assets/audit").glob("validation-report-*.json"):
              report = json.loads(path.read_text(encoding="utf-8"))
              if report.get("provenance", {}).get("validated_commit") == expected:
                  matches.append(path)
          if len(matches) != 1:
              raise SystemExit(f"Expected one validation report for {expected}, got {len(matches)}")
          report_path = matches[0]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"report_name={report_path.name}\n")
          print(f"Verified {report_path} was produced from {expected}")
          PY

      - name: Start local server for browser release gate
        run: |
          python3 scripts/serve-site.py >/tmp/glee-pages-server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/glee-pages-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              echo "Server ready."
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null \
            || { cat /tmp/glee-pages-server.log; exit 1; }

      - name: Verify generated map browser journeys
        run: python3 scripts/tests/test-universe-browser.py

      - name: Run browser responsive and asset QA
        id: responsive_asset_qa
        run: |
          report_dir="$(mktemp -d "$RUNNER_TEMP/glee-responsive-qa.XXXXXXXX")"
          report_path="$report_dir/responsive-failure.json"
          success_path="$report_dir/responsive-success.json"
          printf 'report_path=%s\n' "$report_path" >> "$GITHUB_OUTPUT"
          printf 'success_path=%s\n' "$success_path" >> "$GITHUB_OUTPUT"
          python3 scripts/run-viewport-qa.py --diagnostic-output "$report_path" --success-output "$success_path"

      - name: Validate responsive failure report (diagnostic only)
        id: responsive_diagnostic_validation
        if: ${{ always() && steps.responsive_asset_qa.outcome == 'failure' && steps.responsive_asset_qa.outputs.report_path != '' }}
        env:
          RESPONSIVE_FAILURE_REPORT: ${{ steps.responsive_asset_qa.outputs.report_path }}
        run: |
          python3 - <<'PY'
          import importlib.util
          import json
          import os
          import sys
          from pathlib import Path

          try:
              workspace = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
              scripts_dir = (workspace / "scripts").resolve()
              runner_path = workspace / "scripts" / "run-viewport-qa.py"
              if (scripts_dir != workspace / "scripts" or runner_path.is_symlink()
                  or not runner_path.is_file() or runner_path.resolve().parent != scripts_dir):
                  raise ValueError()
              sys.path.insert(0, str(scripts_dir))
              spec = importlib.util.spec_from_file_location("responsive_runner_contract", runner_path)
              if spec is None or spec.loader is None:
                  raise ValueError()
              runner = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(runner)
              viewport_names = [viewport["name"] for viewport in runner.VIEWPORTS]
              if (not runner.PAGES or not viewport_names
                  or any(not isinstance(name, str) or not name.isascii() or not name.isdecimal()
                         or not 1 <= len(name) <= 4 for name in viewport_names)
                  or len(set(viewport_names)) != len(viewport_names)):
                  raise ValueError()
              path = Path(os.environ["RESPONSIVE_FAILURE_REPORT"])
              if not path.is_file() or path.is_symlink() or path.stat().st_size > 1048576:
                  raise ValueError()
              def unique_object(pairs):
                  result = {}
                  for key, value in pairs:
                      if key in result:
                          raise ValueError()
                      result[key] = value
                  return result

              report = json.loads(path.read_text(encoding="utf-8"), object_pairs_hook=unique_object)
              expected = {"version", "status", "diagnostic_only", "pages_completed",
                          "combinations_completed", "total_issues", "total_warnings", "affected"}
              if not isinstance(report, dict) or set(report) != expected or type(report["version"]) is not int or report["version"] != 1 or report["status"] != "FAIL" or report["diagnostic_only"] is not True:
                  raise ValueError()
              for name in ("pages_completed", "combinations_completed", "total_issues", "total_warnings"):
                  if type(report[name]) is not int or report[name] < 0:
                      raise ValueError()
              if (report["pages_completed"] != len(runner.PAGES)
                  or report["combinations_completed"] != len(runner.PAGES) * len(viewport_names)
                  or not report["total_issues"] or not isinstance(report["affected"], list)):
                  raise ValueError()
              allowed = {"http_error", "horizontal_overflow", "navigation_toggle", "heading_overflow", "image_overflow", "browser_error", "other"}
              issue_count = 0
              seen = set()
              for row in report["affected"]:
                  if not isinstance(row, dict) or set(row) != {"page_index", "viewport", "issue_count", "reason_codes"}:
                      raise ValueError()
                  index, viewport, count, codes = (row[k] for k in ("page_index", "viewport", "issue_count", "reason_codes"))
                  if (type(index) is not int or not 0 <= index < report["pages_completed"]
                      or not isinstance(viewport, str) or viewport not in viewport_names
                      or type(count) is not int or count <= 0 or not isinstance(codes, list) or not codes
                      or any(not isinstance(code, str) or code not in allowed for code in codes)
                      or len(set(codes)) != len(codes) or (index, viewport) in seen):
                      raise ValueError()
                  seen.add((index, viewport))
                  issue_count += count
              if issue_count != report["total_issues"] or len(seen) > report["combinations_completed"]:
                  raise ValueError()
          except Exception:
              raise SystemExit("Responsive failure report unavailable or invalid")
          PY

      - name: Upload failed responsive QA report (diagnostic only)
        id: upload_responsive_qa_failure_diagnostics
        if: ${{ always() && steps.responsive_asset_qa.outcome == 'failure' && steps.responsive_diagnostic_validation.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-responsive-qa-failure-diagnostics-${{ github.sha }}
          path: ${{ steps.responsive_asset_qa.outputs.report_path }}
          if-no-files-found: warn
          retention-days: 14

      - name: Link responsive QA failure diagnostics
        if: ${{ always() && steps.responsive_asset_qa.outcome == 'failure' }}
        env:
          UPLOAD_OUTCOME: ${{ steps.upload_responsive_qa_failure_diagnostics.outcome }}
          ARTIFACT_ID: ${{ steps.upload_responsive_qa_failure_diagnostics.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload_responsive_qa_failure_diagnostics.outputs.artifact-url }}
        run: |
          if [ "$UPLOAD_OUTCOME" = success ] && [ -n "$ARTIFACT_ID" ] && [ -n "$ARTIFACT_URL" ]; then
            echo "**Diagnostic only—not validated release evidence.** [Download the sanitized responsive QA report]($ARTIFACT_URL)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**Diagnostic only—not validated release evidence.** Responsive QA report unavailable; the check failed before a diagnostic was retained or upload failed." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run visitor, privacy, and rendered contrast acceptance
        run: python3 scripts/tests/test_browser_acceptance.py --base-url http://127.0.0.1:5000 --output assets/audit/browser-acceptance.json

      - name: Run resilient web behavior QA
        run: python3 scripts/resilience-qa.py --base-url http://localhost:5000

      - name: Run color-scheme bootstrap regression in all installed engines
        id: theme_browser_checks
        run: |
          failed=0
          for browser in chromium firefox webkit; do
            python3 scripts/tests/test-color-scheme-init.py \
              --base-url http://localhost:5000 \
              --browser "$browser" \
              --output "assets/audit/color-scheme-init-$browser.json" \
              || failed=1
          done
          exit "$failed"

      - name: Summarize browser theme failures (diagnostic only)
        if: ${{ always() && steps.theme_browser_checks.outcome == 'failure' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          expected = (
              ("chromium", "Chromium"),
              ("firefox", "Firefox"),
              ("webkit", "WebKit"),
          )
          case_order = ("light", "dark", "disabled_storage")
          setup_step_labels = {
              "loading_playwright": "loading Playwright",
              "preparing_routes": "preparing routes",
              "entering_browser_manager": "entering the browser manager",
              "launching_browser": "launching the browser engine",
          }
          lines = [
              "## Browser theme failure diagnostics (not validated release evidence)",
              "",
              "**Diagnostic only.** This summary describes a failed gate; it does not "
              "verify or validate any browser result.",
              "",
          ]

          def one_line(value):
              return " ".join(str(value).split()).replace("`", "'")[:300]

          audit_dir = Path("assets/audit")
          for browser, label in expected:
              path = audit_dir / f"color-scheme-init-{browser}.json"
              if not path.is_file():
                  lines.append(
                      f"- **{label}:** failure report unavailable; inspect this engine's workflow log."
                  )
                  continue
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, UnicodeError, json.JSONDecodeError) as error:
                  lines.append(
                      f"- **{label}:** failure report is malformed or unreadable "
                      f"({one_line(error)}); inspect the workflow log."
                  )
                  continue
              if not isinstance(report, dict):
                  lines.append(
                      f"- **{label}:** failure report is malformed (JSON root must "
                      "be an object); inspect the workflow log."
                  )
                  continue

              if "case_results_version" in report:
                  attempted = report.get("attempted_cases")
                  not_run = report.get("not_run_cases")
                  cases = report.get("cases")
                  failures = report.get("case_failures")
                  valid = (
                      type(report.get("case_results_version")) is int
                      and report["case_results_version"] == 1
                      and report.get("browser") == browser
                      and report.get("status") == "FAIL"
                      and report.get("diagnostic_only") is True
                      and report.get("failure_stage") == "theme_check"
                      and isinstance(attempted, list)
                      and isinstance(not_run, list)
                      and isinstance(cases, dict)
                      and isinstance(failures, dict)
                  )
                  if valid:
                      try:
                          workspace = Path(os.environ.get("GITHUB_WORKSPACE", ".")).resolve()
                          scripts_dir = (workspace / "scripts").resolve()
                          contract = workspace / "scripts" / "theme_failure_contract.py"
                          if (scripts_dir != workspace / "scripts"
                              or contract.is_symlink() or not contract.is_file()
                              or contract.resolve().parent != scripts_dir):
                              raise ValueError("Theme failure contract unavailable")
                          sys.path.insert(0, str(scripts_dir))
                          from theme_failure_contract import (
                              DISABLED_STORAGE_ROUTES, PUBLIC_ROUTE_PATTERN,
                              ROUTE_REASON_CODES, UTILITY_ROUTES,
                          )
                      except Exception:
                          valid = False
                      needs_inventory = any(
                          isinstance(record, dict) and "affected_routes" in record
                          for record in failures.values()
                      )
                      allowed_routes = set()
                      if needs_inventory and valid:
                          try:
                              from public_inventory import iter_indexable_urls
                              allowed_routes = set(iter_indexable_urls(workspace)) | set(UTILITY_ROUTES)
                          except Exception:
                              valid = False

                      def valid_failure(case_name, record):
                          if not isinstance(record, dict) or not set(record) <= {
                              "error", "affected_routes", "route_details_incomplete"
                          } or record.get("error") != "Theme case failed.":
                              return False
                          if "route_details_incomplete" in record and record["route_details_incomplete"] is not True:
                              return False
                          if "affected_routes" not in record:
                              return True
                          items = record["affected_routes"]
                          if not isinstance(items, list) or not items:
                              return False
                          seen = set()
                          for item in items:
                              if not isinstance(item, dict) or set(item) != {"route", "reasons"}:
                                  return False
                              route, reasons = item["route"], item["reasons"]
                              if (not isinstance(route, str) or route not in allowed_routes
                                  or not PUBLIC_ROUTE_PATTERN.fullmatch(route) or route in seen
                                  or (case_name == "disabled_storage" and route not in DISABLED_STORAGE_ROUTES)
                                  or not isinstance(reasons, list) or not reasons
                                  or any(not isinstance(reason, str) or reason not in ROUTE_REASON_CODES for reason in reasons)
                                  or len(set(reasons)) != len(reasons)):
                                  return False
                              seen.add(route)
                          return True

                      valid = (
                          valid
                          and
                          all(isinstance(case, str) for case in attempted + not_run)
                          and attempted == list(case_order[:len(attempted)])
                          and not_run == list(case_order[len(attempted):])
                          and not (set(cases) & set(failures))
                          and set(cases) | set(failures) == set(attempted)
                          and bool(failures)
                          and all(isinstance(value, dict) for value in cases.values())
                          and all(valid_failure(name, value) for name, value in failures.items())
                          and report.get("failed_case") == next(
                              (name for name in attempted if name in failures), None
                          )
                          and report.get("failed_routes") in (None, [])
                          and (report.get("cleanup_failed") is None
                               or type(report.get("cleanup_failed")) is bool)
                      )
                  if not valid:
                      lines.append(
                          f"- **{label}:** multi-case report is inconsistent or "
                          "malformed; case sequence and results remain unverified."
                      )
                      continue
                  failed = ", ".join(f"`{name}`" for name in attempted if name in failures)
                  completed = ", ".join(f"`{name}`" for name in attempted if name in cases) or "none"
                  remaining = ", ".join(f"`{name}`" for name in not_run) or "none reported"
                  lines.append(f"- **{label}:** theme checks failed in {failed}.")
                  for name in attempted:
                      if name not in failures:
                          continue
                      failure = failures[name]
                      for item in failure.get("affected_routes", []):
                          reasons = ", ".join(f"`{reason}`" for reason in item["reasons"])
                          lines.append(f"  - Failed case `{name}`, route `{item['route']}`: {reasons}.")
                      if failure.get("route_details_incomplete") is True:
                          lines.append(f"  - Failed case `{name}` has omitted or unavailable route details.")
                  lines.append(
                      "  - Completed theme cases (diagnostic only; not validated "
                      f"evidence): {completed}."
                  )
                  lines.append(
                      f"  - Not run: {remaining}; these cases must not be treated "
                      "as passing or validated evidence."
                  )
                  if report.get("cleanup_failed") is True:
                      lines.append("  - Browser cleanup also failed while closing the browser.")
                  continue

              engine = label
              version = report.get("browser_version")
              if isinstance(version, str) and version.strip():
                  engine += f" ({one_line(version)})"
              reported_browser = report.get("browser")
              if reported_browser not in (None, browser):
                  engine += f" [report says {one_line(reported_browser)}]"

              status = report.get("status")
              failed_case = report.get("failed_case")
              startup_case_conflict = (
                  status == "FAIL"
                  and report.get("failure_stage") == "browser_startup"
                  and isinstance(failed_case, str)
                  and failed_case in case_order
              )
              reported_cases = report.get("cases")
              cases_are_valid = isinstance(reported_cases, dict)
              cases = reported_cases if cases_are_valid else {}
              failure_stage = report.get("failure_stage")
              reported_not_run = report.get("not_run_cases")
              reported_failed_routes = report.get("failed_routes")
              cleanup_case_conflict = (
                  status == "FAIL"
                  and failure_stage == "browser_cleanup"
                  and (
                      not cases_are_valid
                      or set(cases) != set(case_order)
                      or failed_case is not None
                      or reported_failed_routes not in (None, [])
                      or reported_not_run not in (None, [])
                  )
              )
              sequence_unverified = (
                  startup_case_conflict or cleanup_case_conflict
                  or (report.get("cleanup_failed") is True and not cases_are_valid)
              )
              if not cases_are_valid:
                  lines.append(
                      f"- **{engine}:** case results are malformed "
                      "(expected an object); no cases are treated as completed, "
                      "passed, or validated evidence."
                  )
              failed_case = report.get("failed_case")
              completed_order = case_order
              if status == "FAIL" and failure_stage != "browser_cleanup":
                  completed_order = (
                      case_order[:case_order.index(failed_case)]
                      if isinstance(failed_case, str) and failed_case in case_order
                      else ()
                  )
              later_reported_cases = []
              if (
                  status == "FAIL"
                  and not startup_case_conflict
                  and not cleanup_case_conflict
                  and isinstance(failed_case, str)
                  and failed_case in case_order
              ):
                  later_reported_cases = [
                      candidate for candidate in case_order
                      if case_order.index(candidate) > case_order.index(failed_case)
                      and candidate in cases
                  ]
              failed_case_also_not_run = (
                  status == "FAIL"
                  and isinstance(failed_case, str)
                  and isinstance(reported_not_run, list)
                  and failed_case in reported_not_run
              )
              completed_cases = [case for case in completed_order if case in cases]
              completed = (
                  ", ".join(f"`{case}`" for case in completed_cases)
                  or "none"
              )
              if status == "FAIL":
                  failed_case = report.get("failed_case")
                  case = failed_case if (
                      isinstance(failed_case, str) and failed_case in case_order
                  ) else "not identified"
                  if cleanup_case_conflict:
                      failure_label = (
                          "report is inconsistent: browser cleanup failure and "
                          "case results conflict; the case sequence is unverified"
                      )
                  elif case != "not identified" and failure_stage == "browser_startup":
                      failure_label = (
                          "report is inconsistent: browser startup failure and a "
                          "named theme case are both reported; neither is verified"
                      )
                  elif case != "not identified":
                      failure_label = f"theme check failed in `{case}`"
                  elif failure_stage == "browser_startup":
                      failure_label = (
                          "browser startup/setup failed before theme checks began"
                      )
                  elif failure_stage == "theme_checks":
                      failure_label = (
                          "theme-check execution failed without an identified case"
                      )
                  elif failure_stage == "browser_cleanup":
                      failure_label = "browser cleanup failed while closing the browser"
                  else:
                      failure_label = (
                          "browser failure stage and case were not identified"
                      )
                  detail = (
                      "" if failure_stage == "browser_cleanup"
                      else one_line(report.get("error", ""))
                  )
                  suffix = f" — {detail}" if detail else ""
                  lines.append(f"- **{engine}:** {failure_label}{suffix}.")
                  setup_step = report.get("setup_step")
                  if (
                      failure_stage == "browser_startup"
                      and isinstance(setup_step, str)
                      and setup_step in setup_step_labels
                  ):
                      lines.append(
                          "  - Setup phase attempted (diagnostic only; not validated "
                          f"evidence): `{setup_step_labels[setup_step]}`."
                      )
                  if sequence_unverified:
                      lines.append(
                          "  - Case sequence cannot be established from the "
                          "conflicting report; completion and not-run status remain "
                          "unverified."
                      )
                  else:
                      lines.append(
                          "  - Completed before failure (diagnostic only; not "
                          f"validated evidence): {completed}."
                      )
                  if report.get("cleanup_failed") is True:
                      lines.append(
                          "  - Browser cleanup also failed while closing the browser."
                      )
                  if later_reported_cases:
                      later = ", ".join(
                          f"`{candidate}`" for candidate in later_reported_cases
                      )
                      lines.append(
                          "  - **Report is inconsistent:** it lists "
                          f"{later} after failed case `{case}`. These entries "
                          "are ignored and must not be treated as completed, "
                          "passed, or validated evidence."
                      )
                  if failed_case_also_not_run and not cleanup_case_conflict:
                      if case == "not identified":
                          lines.append(
                              "  - **Report is inconsistent:** an unrecognized failure "
                              "label also appears in `not_run_cases`; the actual "
                              "failed case remains unverified."
                          )
                      elif failure_stage == "browser_startup":
                          lines.append(
                              "  - **Report is inconsistent:** the reported theme case "
                              f"`{case}` is also listed in `not_run_cases`; the "
                              "actual failed case remains unverified."
                          )
                      else:
                          lines.append(
                              "  - **Report is inconsistent:** the failed case "
                              f"`{case}` is also listed in `not_run_cases`. It is "
                              "treated as failed, not completed, passed, or "
                              "validated evidence."
                          )
                  failed_routes = report.get("failed_routes")
                  if not cleanup_case_conflict and isinstance(failed_routes, list) and failed_routes:
                      lines.append(
                          "  - Affected pages (diagnostic only; not validated "
                          "release evidence):"
                      )
                      for failure in failed_routes:
                          if not isinstance(failure, dict):
                              continue
                          route = failure.get("route")
                          if not isinstance(route, str) or not route.strip():
                              continue
                          detail = one_line(failure.get("error", ""))
                          suffix = f": {detail}" if detail else ""
                          lines.append(
                              f"    - `{one_line(route)}`{suffix}"
                          )
                  if case != "not identified":
                      remaining = [
                          candidate for candidate in case_order
                          if case_order.index(candidate) > case_order.index(case)
                      ]
                  else:
                      remaining = (
                          [candidate for candidate in reported_not_run
                           if candidate in case_order]
                          if isinstance(reported_not_run, list)
                          else [
                              candidate for candidate in case_order
                              if candidate not in cases
                          ]
                      )
                  not_run = ", ".join(f"`{candidate}`" for candidate in remaining)
                  if not sequence_unverified:
                      lines.append(
                          f"  - Not run: {not_run or 'none reported'}; these cases "
                          "must not be treated as passing or validated evidence."
                      )
                  if report.get("diagnostic_only") is not True:
                      lines.append(
                          "  - Report is missing its diagnostic-only marker; "
                          "treat the details as unverified."
                      )
              elif status == "PASS":
                  if cases_are_valid:
                      lines.append(
                          f"- **{engine}:** completed cases (diagnostic only; not "
                          f"validated evidence): {completed}."
                      )
                      missing = [case for case in case_order if case not in cases]
                  else:
                      lines.append(
                          f"- **{engine}:** PASS status cannot establish completed "
                          "cases because case results are malformed."
                      )
                      missing = []
                  if missing:
                      lines.append(
                          "  - Not reported despite PASS status (not validated): "
                          + ", ".join(f"`{case}`" for case in missing)
                          + "."
                      )
              else:
                  lines.append(
                      f"- **{engine}:** failure report has no recognized status "
                      f"({one_line(status) or 'missing'}); inspect the workflow log."
                  )

          summary = "\n".join(lines) + "\n"
          print(summary, end="")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as output:
                  output.write(summary)
          PY

      - name: Upload failed browser theme reports (diagnostic only)
        id: upload_theme_failure_diagnostics
        if: ${{ always() && steps.theme_browser_checks.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-theme-failure-diagnostics-${{ github.sha }}
          path: assets/audit/color-scheme-init-*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Link browser theme failure diagnostics
        if: ${{ always() && steps.theme_browser_checks.outcome == 'failure' }}
        env:
          DIAGNOSTIC_ARTIFACT_NAME: pages-theme-failure-diagnostics-${{ github.sha }}
          RUN_ARTIFACTS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
        run: |
          echo "**Diagnostic only—not validated release evidence.** Download the full browser JSON from the [Pages run artifacts]($RUN_ARTIFACTS_URL): \`$DIAGNOSTIC_ARTIFACT_NAME\`." \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Verify browser-specific theme evidence
        id: theme_evidence
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          audit_dir = Path("assets/audit")
          expected = ("chromium", "firefox", "webkit")
          missing = []
          invalid = []
          versions = {}
          for browser in expected:
              path = audit_dir / f"color-scheme-init-{browser}.json"
              if not path.is_file():
                  missing.append(path.name)
                  continue
              try:
                  report = json.loads(path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  invalid.append(f"{path.name}: cannot parse JSON ({error})")
                  continue
              if report.get("browser") != browser:
                  invalid.append(
                      f"{path.name}: browser={report.get('browser')!r}, expected {browser!r}"
                  )
              version = report.get("browser_version")
              if not isinstance(version, str) or not version.strip():
                  invalid.append(
                      f"{path.name}: browser_version must be a non-empty string"
                  )
              else:
                  versions[browser] = version.strip()
              if report.get("status") != "PASS":
                  invalid.append(f"{path.name}: status={report.get('status')!r}, expected 'PASS'")
              if (
                  "case_results_version" in report
                  or report.get("case_failures") not in (None, {})
                  or report.get("not_run_cases") not in (None, [])
                  or report.get("failed_case") is not None
                  or (report.get("cleanup_failed") is not None
                      and report.get("cleanup_failed") is not False)
              ):
                  invalid.append(f"{path.name}: diagnostic case failures are not release evidence")
              cases = report.get("cases")
              if not isinstance(cases, dict) or not {"light", "dark", "disabled_storage"} <= cases.keys():
                  invalid.append(
                      f"{path.name}: expected light, dark, and disabled_storage cases"
                  )

          if missing or invalid:
              details = []
              if missing:
                  details.append("missing: " + ", ".join(missing))
              if invalid:
                  details.append("invalid: " + "; ".join(invalid))
              raise SystemExit(
                  "Browser-specific color-scheme evidence is incomplete; "
                  + " | ".join(details)
              )
          rows = [
              "| Browser engine | Browser version | Covered cases | Report |",
              "| --- | --- | --- | --- |",
          ]
          labels = {
              "chromium": "Chromium",
              "firefox": "Firefox",
              "webkit": "WebKit",
          }
          covered_cases = (
              "`light` (saved light preference); "
              "`dark` (saved dark preference); "
              "`disabled_storage` (local storage blocked)"
          )
          for browser in expected:
              report_name = f"color-scheme-init-{browser}.json"
              rows.append(
                  f"| {labels[browser]} | {versions[browser]} | {covered_cases} | "
                  f"[`{report_name}`]({report_name}) |"
              )
          index = [
              "# Browser color-scheme evidence",
              "",
              "Generated from the successful browser theme checks for this "
              "Pages validation run.",
              "",
              *rows,
              "",
          ]
          (audit_dir / "color-scheme-evidence-index.md").write_text(
              "\n".join(index), encoding="utf-8"
          )
          print("Verified browser-specific color-scheme evidence for chromium, firefox, and webkit.")
          PY

      - name: Verify custom domain and required public files
        run: |
          test -s CNAME
          test "$(cat CNAME)" = "glee-fully.tools"
          test -s index.html
          test -s 404.html
          test -s offline.html
          test -s sw.js
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest

      - name: Stage and verify the reviewed public inventory
        run: |
          python3 scripts/public-artifact.py stage --output "$RUNNER_TEMP/glee-public-site"
          python3 scripts/public-artifact.py verify --output "$RUNNER_TEMP/glee-public-site"
          python3 scripts/check-pages-artifact.py "$RUNNER_TEMP/glee-public-site"

      - name: Upload artifact from validated commit
        uses: actions/upload-artifact@v7
        with:
          name: pages-site-${{ github.sha }}
          path: ${{ runner.temp }}/glee-public-site
          # Only the allowlisted, verified staging tree can include hidden files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Stage complete validation evidence
        id: validation_staging
        if: ${{ success() && steps.validation_provenance.outcome == 'success' && steps.theme_evidence.outcome == 'success' }}
        env:
          VALIDATION_ARTIFACT_DIR: ${{ runner.temp }}/pages-validation
          VALIDATION_REPORT_NAME: ${{ steps.validation_provenance.outputs.report_name }}
          RESPONSIVE_SUCCESS_REPORT: ${{ steps.responsive_asset_qa.outputs.success_path }}
        run: |
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          artifact_dir = Path(os.environ["VALIDATION_ARTIFACT_DIR"])
          audit_dir = artifact_dir / "assets" / "audit"
          shutil.copytree("assets/audit", audit_dir)

          responsive_source = Path(os.environ["RESPONSIVE_SUCCESS_REPORT"])
          responsive_target = audit_dir / "viewport-qa-full-current-run.json"
          if not responsive_source.is_file() or responsive_source.is_symlink() or responsive_target.exists():
              raise SystemExit("Current responsive QA report unavailable or staging path already exists")
          shutil.copy2(responsive_source, responsive_target)

          current_report = os.environ["VALIDATION_REPORT_NAME"]
          for report in audit_dir.glob("validation-report-*.json"):
              if report.name != current_report:
                  report.unlink()

          audit_summary = Path("assets/docs/audit-report.md")
          if audit_summary.is_file():
              destination = artifact_dir / audit_summary
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(audit_summary, destination)
              with destination.open("a", encoding="utf-8") as report:
                  report.write(
                      "\n\n## Browser theme release evidence\n\n"
                      "See the [browser color-scheme evidence index]"
                      "(../audit/color-scheme-evidence-index.md) for the "
                      "Chromium, Firefox, and WebKit reports from this "
                      "validation run.\n"
                  )
          PY

      - name: Upload validation reports
        id: upload_validation_reports
        if: ${{ always() && steps.validation_provenance.outcome == 'success' && steps.validation_staging.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: pages-validation-${{ github.sha }}
          path: ${{ runner.temp }}/pages-validation
          if-no-files-found: warn
          retention-days: 90

  verify-validation-evidence:
    name: Verify uploaded Pages validation evidence
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Verify validation artifact retention
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          VALIDATION_ARTIFACT_ID: ${{ needs.validate.outputs.validation_artifact_id }}
          EXPECTED_ARTIFACT_NAME: pages-validation-${{ github.sha }}
          EXPECTED_RUN_ID: ${{ github.run_id }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$VALIDATION_ARTIFACT_ID"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$EXPECTED_RUN_ID" \
            --output "$RUNNER_TEMP/pages-workflow-run.json"
          curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$VALIDATION_ARTIFACT_ID" \
            | python3 scripts/check-pages-validation-retention.py \
                --artifact-id "$VALIDATION_ARTIFACT_ID" \
                --artifact-name "$EXPECTED_ARTIFACT_NAME" \
                --run-metadata "$RUNNER_TEMP/pages-workflow-run.json" \
                --run-id "$EXPECTED_RUN_ID" \
                --commit "$EXPECTED_COMMIT"

      - name: Download validation reports for this commit
        uses: actions/download-artifact@v8
        with:
          name: pages-validation-${{ github.sha }}
          path: ${{ runner.temp }}/pages-validation

      - name: Verify downloaded browser theme reports
        id: downloaded_theme_evidence
        env:
          VALIDATION_ARTIFACT_DIR: ${{ runner.temp }}/pages-validation
        run: |
          python3 - <<'PY'
          import os
          import json
          from pathlib import Path

          validation_dir = Path(os.environ["VALIDATION_ARTIFACT_DIR"])
          audit_dir = validation_dir / "assets" / "audit"
          expected = (
              "color-scheme-init-chromium.json",
              "color-scheme-init-firefox.json",
              "color-scheme-init-webkit.json",
          )
          missing = [name for name in expected if not (audit_dir / name).is_file()]
          index_path = audit_dir / "color-scheme-evidence-index.md"
          if not index_path.is_file():
              missing.append(index_path.name)
          if missing:
              raise SystemExit(
                  "Downloaded Pages validation artifact is missing browser theme reports: "
                  + ", ".join(missing)
              )
          index = index_path.read_text(encoding="utf-8")
          labels = {
              "chromium": "Chromium",
              "firefox": "Firefox",
              "webkit": "WebKit",
          }
          covered_cases = (
              "`light` (saved light preference); "
              "`dark` (saved dark preference); "
              "`disabled_storage` (local storage blocked)"
          )
          required_rows = set()
          for browser, label in labels.items():
              report_path = audit_dir / f"color-scheme-init-{browser}.json"
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise SystemExit(
                      f"{report_path.name}: cannot parse downloaded JSON ({error})"
                  )
              if report.get("browser") != browser:
                  raise SystemExit(
                      f"{report_path.name}: browser={report.get('browser')!r}, "
                      f"expected {browser!r}"
                  )
              if (
                  "case_results_version" in report
                  or report.get("case_failures") not in (None, {})
                  or report.get("not_run_cases") not in (None, [])
                  or report.get("failed_case") is not None
                  or (report.get("cleanup_failed") is not None
                      and report.get("cleanup_failed") is not False)
              ):
                  raise SystemExit(f"{report_path.name}: diagnostic case failures are not release evidence")
              version = report.get("browser_version")
              if not isinstance(version, str) or not version.strip():
                  raise SystemExit(
                      f"{report_path.name}: browser_version must be a non-empty string"
                  )
              report_name = report_path.name
              required_rows.add(
                  f"| {label} | {version.strip()} | {covered_cases} | "
                  f"[`{report_name}`]({report_name}) |"
              )
          missing_rows = sorted(row for row in required_rows if row not in index)
          if missing_rows:
              raise SystemExit(
                  "Downloaded Pages validation artifact has an incomplete browser "
                  "theme index: " + "; ".join(missing_rows)
              )
          audit_summary = validation_dir / "assets" / "docs" / "audit-report.md"
          if not audit_summary.is_file():
              raise SystemExit(
                  "Downloaded Pages validation artifact is missing assets/docs/audit-report.md"
              )
          summary_text = audit_summary.read_text(encoding="utf-8")
          if (
              "[browser color-scheme evidence index]"
              "(../audit/color-scheme-evidence-index.md)"
          ) not in summary_text:
              raise SystemExit(
                  "Downloaded audit report does not link to the browser theme index"
              )
          print(
              "Verified all three browser theme reports and their indexed cases "
              "in the downloaded Pages validation artifact."
          )
          PY

      - name: Add verified browser theme results to run summary
        if: ${{ success() && steps.downloaded_theme_evidence.outcome == 'success' }}
        env:
          VALIDATION_ARTIFACT_DIR: ${{ runner.temp }}/pages-validation
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          validation_dir = Path(os.environ["VALIDATION_ARTIFACT_DIR"])
          audit_dir = validation_dir / "assets" / "audit"
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              raise SystemExit("GITHUB_STEP_SUMMARY is not available")

          browsers = (
              ("chromium", "Chromium"),
              ("firefox", "Firefox"),
              ("webkit", "WebKit"),
          )
          required_cases = {"light", "dark", "disabled_storage"}
          rows = [
              "| Browser engine | Browser version | Light preference | "
              "Dark preference | Disabled storage | Evidence |",
              "| --- | --- | --- | --- | --- | --- |",
          ]
          for browser, label in browsers:
              report_path = audit_dir / f"color-scheme-init-{browser}.json"
              try:
                  report = json.loads(report_path.read_text(encoding="utf-8"))
              except (OSError, json.JSONDecodeError) as error:
                  raise SystemExit(
                      f"{report_path.name}: cannot read verified browser report ({error})"
                  )
              if report.get("browser") != browser or report.get("status") != "PASS":
                  raise SystemExit(
                      f"{report_path.name}: expected {browser} report with PASS status"
                  )
              if (
                  "case_results_version" in report
                  or report.get("case_failures") not in (None, {})
                  or report.get("not_run_cases") not in (None, [])
                  or report.get("failed_case") is not None
                  or (report.get("cleanup_failed") is not None
                      and report.get("cleanup_failed") is not False)
              ):
                  raise SystemExit(f"{report_path.name}: diagnostic case failures are not release evidence")
              version = report.get("browser_version")
              if not isinstance(version, str) or not version.strip():
                  raise SystemExit(
                      f"{report_path.name}: browser_version must be a non-empty string"
                  )
              cases = report.get("cases")
              if not isinstance(cases, dict) or not required_cases <= cases.keys():
                  raise SystemExit(
                      f"{report_path.name}: expected light, dark, and disabled_storage cases"
                  )
              rows.append(
                  f"| {label} | {version.strip()} | Pass | Pass | Pass | "
                  f"`{report_path.name}` |"
              )

          summary = [
              "## Browser theme results",
              "",
              "The downloaded, verified Pages validation artifact passed these cases:",
              "",
              *rows,
              "",
              "Light and dark use saved preferences; disabled storage blocks local storage.",
              "",
          ]
          with Path(summary_path).open("a", encoding="utf-8") as output:
              output.write("\n".join(summary))
          PY

  deploy:
    name: Deploy validated Pages artifact
    needs: [validate, verify-validation-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact release commit for artifact verification
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download artifact for this commit
        uses: actions/download-artifact@v8
        with:
          name: pages-site-${{ github.sha }}
          path: ${{ runner.temp }}/glee-public-site

      - name: Set up the matching generation runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Reproduce generated release files from the exact commit
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py
          python3 scripts/sync-universe-map.py --check

      - name: Verify transferred inventory, hidden public files, and release bytes
        run: python3 scripts/public-artifact.py verify --output "$RUNNER_TEMP/glee-public-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/glee-public-site
          # v5 also filters dot paths by default; preserve the verified files.
          include-hidden-files: true

      - name: Verify the final Pages archive before deployment
        run: |
          python3 scripts/public-artifact.py verify-tar \
            --output "$RUNNER_TEMP/glee-public-site" --archive "$RUNNER_TEMP/artifact.tar"

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test live security headers
        continue-on-error: true
        run: python3 scripts/check-public-headers.py --url https://glee-fully.tools/
