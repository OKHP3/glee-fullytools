name: Publish GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release commit and build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prove checkout matches the event commit
        run: |
          checked_out_commit="$(git rev-parse HEAD)"
          expected_commit="${{ github.sha }}"
          test -n "$expected_commit"
          if [ "$checked_out_commit" != "$expected_commit" ]; then
            echo "::error::Checkout $checked_out_commit does not match event commit $expected_commit"
            exit 1
          fi
          echo "Validated release commit: $checked_out_commit"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: npm

      - name: Install Node QA dependencies
        run: npm ci

      - name: Install Node Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Check GitHub Actions versions
        run: python3 scripts/check-workflow-actions.py

      - name: Install validator dependency
        run: python3 -m pip install -r requirements-qa.txt

      - name: Install browsers for browser release gate
        run: playwright install --with-deps chromium firefox webkit

      - name: Generate current search and universe maps
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py

      - name: Check universe integration and freshness
        run: |
          python3 scripts/tests/test-universe-integration.py
          python3 .agents/skills/okhp3-universe-map/tests/test-universe-map.py
          python3 scripts/sync-universe-map.py --check

      - name: Check generated search index
        run: python3 scripts/build-search-index.py --check

      - name: Check generated portfolio statistics
        run: python3 scripts/sync-portfolio-stats.py --check

      - name: Check generated sitemap and feed
        run: |
          python3 scripts/generate-sitemap.py --check
          python3 scripts/generate-feed.py --check

      - name: Check CSS cache tokens
        run: python3 scripts/sync-css-version.py --check

      - name: Check landscape social-card metadata
        run: python3 scripts/sync-social-card.py --check

      - name: Run static release gates
        run: |
          python3 scripts/check-csp.py
          python3 scripts/tests/test-visitor-truth.py
          python3 scripts/tests/test_content_claims.py
          python3 scripts/tests/test-search-index.py
          python3 scripts/tests/test_public_artifact.py
          python3 scripts/tests/test_svg_assets.py
          python3 scripts/tests/test_offline_validation.py
          node --test scripts/tests/test-sw-resilience.cjs
          node scripts/tests/test-sw-bootstrap.cjs
          python3 scripts/validate-site.py
          python3 scripts/check-links.py
          python3 scripts/check-accent-contrast.py --strict
          python3 scripts/check-glee-dark-coverage.py --section all --require-both

      - name: Run FoundRy accessibility evidence
        run: npm run qa:foundry-accessibility

      - name: Run advisory site audit
        continue-on-error: true
        run: python3 scripts/audit-site.py --quiet

      - name: Start local server for browser release gate
        run: |
          python3 scripts/serve-site.py >/tmp/glee-pages-server.log 2>&1 &
          server_pid=$!
          echo "$server_pid" > /tmp/glee-pages-server.pid
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:5000/ >/dev/null; then
              echo "Server ready."
              break
            fi
            sleep 0.5
          done
          curl --silent --fail http://127.0.0.1:5000/ >/dev/null \
            || { cat /tmp/glee-pages-server.log; exit 1; }

      - name: Verify generated map browser journeys
        run: python3 scripts/tests/test-universe-browser.py

      - name: Run browser responsive and asset QA
        run: python3 scripts/run-viewport-qa.py

      - name: Run visitor, privacy, and rendered contrast acceptance
        run: python3 scripts/tests/test_browser_acceptance.py --base-url http://127.0.0.1:5000 --output assets/audit/browser-acceptance.json

      - name: Run resilient web behavior QA
        run: python3 scripts/resilience-qa.py --base-url http://localhost:5000

      - name: Verify custom domain and required public files
        run: |
          test -s CNAME
          test "$(cat CNAME)" = "glee-fully.tools"
          test -s index.html
          test -s 404.html
          test -s offline.html
          test -s sw.js
          test -s robots.txt
          test -s sitemap.xml
          test -s site.webmanifest

      - name: Stage and verify the reviewed public inventory
        run: |
          python3 scripts/public-artifact.py stage --output "$RUNNER_TEMP/glee-public-site"
          python3 scripts/public-artifact.py verify --output "$RUNNER_TEMP/glee-public-site"
          python3 scripts/check-pages-artifact.py "$RUNNER_TEMP/glee-public-site"

      - name: Upload artifact from validated commit
        uses: actions/upload-artifact@v7
        with:
          name: pages-site-${{ github.sha }}
          path: ${{ runner.temp }}/glee-public-site
          # Only the allowlisted, verified staging tree can include hidden files.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pages-validation-${{ github.sha }}
          path: |
            assets/audit/
            assets/docs/audit-report.md
          if-no-files-found: warn
          retention-days: 14

  deploy:
    name: Deploy validated Pages artifact
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact release commit for artifact verification
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Download artifact for this commit
        uses: actions/download-artifact@v8
        with:
          name: pages-site-${{ github.sha }}
          path: ${{ runner.temp }}/glee-public-site

      - name: Set up the matching generation runtime
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Reproduce generated release files from the exact commit
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py
          python3 scripts/sync-universe-map.py --check

      - name: Verify transferred inventory, hidden public files, and release bytes
        run: python3 scripts/public-artifact.py verify --output "$RUNNER_TEMP/glee-public-site"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare Pages upload
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/glee-public-site
          # v5 also filters dot paths by default; preserve the verified files.
          include-hidden-files: true

      - name: Verify the final Pages archive before deployment
        run: |
          python3 scripts/public-artifact.py verify-tar \
            --output "$RUNNER_TEMP/glee-public-site" --archive "$RUNNER_TEMP/artifact.tar"

      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Smoke-test live security headers
        continue-on-error: true
        run: python3 scripts/check-public-headers.py --url https://glee-fully.tools/
