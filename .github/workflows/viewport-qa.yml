name: Viewport QA

# Run whenever CSS, JS, or HTML changes — these are the only inputs that can
# introduce responsive-layout regressions. Also available on manual trigger.
on:
  push:
    branches: [main]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - '**/*.html'
  pull_request:
    branches: [main]
    paths:
      - 'assets/css/**'
      - 'assets/js/**'
      - '**/*.html'
  workflow_dispatch:

jobs:
  viewport-qa:
    runs-on: ubuntu-latest
    # Budget formula: (pages × 8 viewports × ~2 s/page) + ~5 min overhead.
    # At 59 pages that is ~21 min; raised to 30 to give headroom as new
    # tool-ettes are added.  Revisit when the page count exceeds ~100.
    timeout-minutes: 30
    name: Responsive viewport QA (all pages × 8 viewports)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright

      - name: Install Playwright browsers and system dependencies
        run: playwright install --with-deps chromium

      - name: Start local HTTP server
        # Use serve.py (no-cache headers) so Playwright always fetches fresh assets.
        # Redirect output so the background process doesn't spam the log.
        run: python3 serve.py > /tmp/serve.log 2>&1 &

      - name: Wait for server to be ready on port 5000
        # Poll until the server responds or 15 s elapse.
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ > /dev/null && echo "Server ready." && break
            sleep 0.5
          done
          curl -sf http://localhost:5000/ > /dev/null \
            || { echo "ERROR: server did not start in time"; cat /tmp/serve.log; exit 1; }

      - name: Run viewport QA
        # run-viewport-qa.py exits 1 when any horizontal-overflow issue is found,
        # causing this step (and the workflow) to fail.  It also compiles a
        # libgbm.so.1 stub (harmless on Ubuntu where --disable-gpu is used).
        run: python3 scripts/run-viewport-qa.py

      - name: Upload QA report and failure screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-qa-report
          path: |
            assets/audit/viewport-qa-full-*.json
            assets/audit/screenshots/
          retention-days: 30
