name: Viewport QA

# Run on every push and pull request because this check is required by branch
# protection. Path filters would leave dependency-only PRs permanently blocked.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: viewport-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  viewport-qa:
    runs-on: ubuntu-latest
    # Budget formula: (pages × 8 viewports × ~2 s/page) + ~5 min overhead.
    # Page count is reported dynamically in the "Report page count" step.
    # 30 min gives headroom up to ~100 pages before this needs revisiting.
    timeout-minutes: 30
    name: Responsive viewport QA (all pages × 8 viewports)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install playwright

      - name: Install Playwright browsers and system dependencies
        run: playwright install --with-deps chromium

      - name: Start local HTTP server
        # Use the no-cache local server so Playwright always fetches fresh assets.
        # Redirect output so the background process doesn't spam the log.
        run: python3 scripts/serve-site.py > /tmp/serve.log 2>&1 &

      - name: Wait for server to be ready on port 5000
        # Poll until the server responds or 15 s elapse.
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/ > /dev/null && echo "Server ready." && break
            sleep 0.5
          done
          curl -sf http://localhost:5000/ > /dev/null \
            || { echo "ERROR: server did not start in time"; cat /tmp/serve.log; exit 1; }

      - name: Report page count
        # Echo the live page count so it is visible in the Actions log without
        # hardcoding a number.  Mirrors the glob logic in run-viewport-qa.py:
        #   CORE_PAGES (14 stable top-level and utility pages, not under toolbox/)
        #   + toolbox/*/index.html          (branch hubs)
        #   + toolbox/*/*/index.html        (tool-ettes)
        run: |
          python3 - <<'EOF'
          from pathlib import Path
          root = Path('.')
          branches = len(list(root.glob('toolbox/*/index.html')))
          tools    = len(list(root.glob('toolbox/*/*/index.html')))
          total    = 14 + branches + tools   # 14 = len(CORE_PAGES) in run-viewport-qa.py
          print(f'Running viewport QA: {total} pages × 8 viewports')
          print(f'  core={14}  branches={branches}  tool-ettes={tools}')
          EOF

      - name: Run viewport QA
        # run-viewport-qa.py exits 1 when any horizontal-overflow issue is found,
        # causing this step (and the workflow) to fail.  It also compiles a
        # libgbm.so.1 stub (harmless on Ubuntu where --disable-gpu is used).
        run: python3 scripts/run-viewport-qa.py

      - name: Run inclusive accessibility QA
        run: python3 scripts/inclusive-accessibility-qa.py

      - name: Upload QA report and failure screenshots
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: viewport-qa-report
          path: |
            assets/audit/viewport-qa-full-*.json
            assets/audit/inclusive-accessibility-qa-*.json
            assets/audit/screenshots/
          retention-days: 30
