name: Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate site HTML, links, and structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Rebuild search index
        run: python3 scripts/build-search-index.py

      - name: Sync portfolio stats
        run: python3 scripts/sync-portfolio-stats.py

      - name: Sync CSS cache-buster tokens
        # Keep generated pages aligned with theme.css before the validator runs.
        # The validator still reports the exact repair command for local releases.
        run: python3 scripts/sync-css-version.py

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Run link checker
        run: python3 scripts/check-links.py

      - name: Verify search index was built
        run: |
          if [ ! -f assets/data/search-index.json ]; then
            echo "ERROR: search-index.json not found after build step"
            exit 1
          fi
          echo "Search index OK: $(wc -c < assets/data/search-index.json) bytes"

      - name: Accent contrast check (strict)
        # --strict converts any ADVISORY finding into exit 1, blocking the PR.
        # Baseline is clean (0 advisories). A future PR introducing a low-contrast
        # color: rule in a dark-mode block will fail here before it can merge.
        run: python3 scripts/check-accent-contrast.py --strict
