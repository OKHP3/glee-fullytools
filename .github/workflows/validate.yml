name: Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate site HTML, links, and structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check GitHub Actions versions
        run: python3 scripts/check-workflow-actions.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install beautifulsoup4

      - name: Check committed search index is current
        run: python3 scripts/build-search-index.py --check

      - name: Check committed portfolio stats are current
        run: python3 scripts/sync-portfolio-stats.py --check

      - name: Check CSS cache-buster tokens are current
        run: python3 scripts/sync-css-version.py --check

      - name: Run template metadata regressions
        run: python3 -m unittest scripts/tests/test_validate_template_metadata.py

      - name: Run accent contrast fixture regressions
        run: python3 -m unittest scripts/tests/test_check_accent_contrast.py

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Run link checker
        run: python3 scripts/check-links.py

      - name: Verify search index was built
        run: |
          if [ ! -f assets/data/search-index.json ]; then
            echo "ERROR: search-index.json not found after build step"
            exit 1
          fi
          echo "Search index OK: $(wc -c < assets/data/search-index.json) bytes"

      - name: Accent contrast check (strict)
        # --strict converts any ADVISORY finding into exit 1, blocking the PR.
        # Baseline is clean (0 advisories). A future PR introducing a low-contrast
        # color: rule in a dark-mode block will fail here before it can merge.
        run: python3 scripts/check-accent-contrast.py --strict

      - name: Check branded dark-mode coverage
        run: python3 scripts/check-glee-dark-coverage.py --section all --require-both

  review-action-versions:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Review newer GitHub Actions major versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review approved actions for newer stable majors
        run: python3 scripts/check-workflow-actions.py --check-updates
