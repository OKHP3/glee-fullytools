name: Site Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate site HTML, links, and structure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check GitHub Actions versions
        run: python3 scripts/check-workflow-actions.py

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python3 -m pip install -r requirements-qa.txt

      - name: Generate current search and universe maps
        run: |
          python3 scripts/build-search-index.py
          python3 scripts/sync-portfolio-stats.py
          python3 scripts/build-search-index.py
          python3 scripts/sync-css-version.py

      - name: Check universe integration and freshness
        run: |
          python3 scripts/tests/test-universe-integration.py
          python3 .agents/skills/okhp3-universe-map/tests/test-universe-map.py
          python3 scripts/sync-universe-map.py --check

      - name: Check committed search index is current
        run: python3 scripts/build-search-index.py --check

      - name: Check committed sitemap is current
        run: python3 scripts/generate-sitemap.py --check

      - name: Check committed feed is current
        run: python3 scripts/generate-feed.py --check

      - name: Check committed portfolio stats are current
        run: python3 scripts/sync-portfolio-stats.py --check

      - name: Check CSS cache-buster tokens are current
        run: python3 scripts/sync-css-version.py --check

      - name: Check landscape social-card metadata
        run: python3 scripts/sync-social-card.py --check

      - name: Check generated CSP policies
        run: python3 scripts/check-csp.py

      - name: Run template metadata regressions
        run: python3 -m unittest scripts/tests/test_validate_template_metadata.py

      - name: Run publication and offline release regressions
        run: |
          python3 scripts/tests/test-reconciliation.py
          python3 scripts/tests/test_sync_css_version.py
          python3 -m unittest scripts.tests.test_browser_acceptance_fixture

      - name: Run post-merge hook regressions
        run: python3 scripts/tests/test-post-merge.py

      - name: Run client behavior regressions
        run: node scripts/tests/test-client-regressions.cjs

      - name: Run CLS session-window regressions
        run: node --test scripts/tests/test-cls-session-window.cjs

      - name: Run discovery, publication, asset, and artifact regressions
        run: |
          python3 scripts/tests/test-visitor-truth.py
          python3 scripts/tests/test_content_claims.py
          python3 scripts/tests/test-search-index.py
          python3 scripts/tests/test_public_artifact.py
          python3 scripts/tests/test_svg_assets.py
          python3 scripts/tests/test_offline_validation.py
          node --test scripts/tests/test-sw-resilience.cjs
          node scripts/tests/test-sw-bootstrap.cjs

      - name: Check skill identities and branch-audit regressions
        run: |
          python3 .agents/skills/okhp3-skill-cataloger/scripts/gen-skills-readme.py --skills-dir .agents/skills --check --quiet
          python3 .agents/skills/okhp3-replit-repl-janitor/tests/test-audit-repo.py

      - name: Run social-card synchronizer regressions
        run: python3 -m unittest scripts/tests/test_sync_social_card.py

      - name: Run accent contrast fixture regressions
        run: python3 -m unittest scripts/tests/test_check_accent_contrast.py

      - name: Run site validator
        run: python3 scripts/validate-site.py

      - name: Run link checker
        run: python3 scripts/check-links.py

      - name: Verify search index was built
        run: |
          if [ ! -f assets/data/search-index.json ]; then
            echo "ERROR: search-index.json not found after build step"
            exit 1
          fi
          echo "Search index OK: $(wc -c < assets/data/search-index.json) bytes"

      - name: Accent contrast check (strict)
        # --strict converts any ADVISORY finding into exit 1, blocking the PR.
        # Baseline is clean (0 advisories). A future PR introducing a low-contrast
        # color: rule in a dark-mode block will fail here before it can merge.
        run: python3 scripts/check-accent-contrast.py --strict

      - name: Check branded dark-mode coverage
        run: python3 scripts/check-glee-dark-coverage.py --section all --require-both

  review-action-versions:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    name: Review newer GitHub Actions major versions

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Review approved actions for newer stable majors
        run: python3 scripts/check-workflow-actions.py --check-updates
