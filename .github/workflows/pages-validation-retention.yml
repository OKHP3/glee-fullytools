name: Monitor Pages validation evidence retention

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  monitor:
    name: Check active Pages evidence review windows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout monitor
        uses: actions/checkout@v7

      - name: Check Pages validation evidence remains downloadable
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/check-pages-validation-retention.py \
            --monitor-window \
            --repository "$GITHUB_REPOSITORY" \
            --api-url "$GITHUB_API_URL" \
            --token "$GITHUB_TOKEN"
